# ============================================================
# HikariCP connection pool (dung chung cho DBUtils)
# ============================================================
# So connection toi da trong pool (giam de tieu tai RAM)
hikari.maximumPoolSize=10
# So connection idle toi thieu luon giu san
hikari.minimumIdle=3
# Thoi gian cho lay connection tu pool truoc khi nem loi (ms)
hikari.connectionTimeout=30000
# Thoi gian connection idle bi dong (ms) - 10 phut
hikari.idleTimeout=600000
# Thoi gian song toi da cua 1 connection (ms) - 30 phut
hikari.maxLifetime=1800000

# ============================================================
# JDBC Batch configuration for performance
# ============================================================
spring.jdbc.batch.size=1000
spring.jdbc.batch.ordered=true
